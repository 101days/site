name: Auto Update Submodules

on:
  # 1. 定时任务：每小时的第 0 分钟触发
  schedule:
    - cron: '0 * * * *'
  # 2. 手动触发：让你也可以在网页上点按钮立即更新
  workflow_dispatch:

permissions:
  contents: write # 重要：给予写权限，否则无法提交代码

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # 拉取完整历史，避免提交报错

      - name: Pull Submodules
        run: |
          # 更新所有子模块到最新 commit
          git submodule update --remote

      - name: Check & Push
        run: |
          # 配置机器人身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有文件变化
          if [[ -n $(git status -s) ]]; then
            echo "Detected changes. Pushing..."
            git add .
            git commit -m "chore: auto sync content from submodules"
            git push
          else
            echo "No changes found. Skipping push."
          fi
